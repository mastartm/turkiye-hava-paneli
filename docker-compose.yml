# Yerel geliştirme veritabanı. Parola .env dosyasından gelir (.env commit'lenmez, bkz. .env.example).
# Kullanım:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hava_paneli}
      POSTGRES_USER: ${POSTGRES_USER:-hava_user}
      # ':?' ile parola tanımlı değilse compose hata verir: boş/varsayılan parolayla çalışmasın.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      # Sadece bu bilgisayardan erişilir (127.0.0.1); ağdaki diğer cihazlar bağlanamaz.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
