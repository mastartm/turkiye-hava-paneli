# Tek komutla tüm uygulama:   docker compose up -d --build     ->  http://localhost:8080
# Parola ve veritabanı adı .env dosyasından gelir (.env commit'lenmez; örnek: .env.example).
# Gerekli değişkenler: POSTGRES_PASSWORD (zorunlu), POSTGRES_USER, POSTGRES_DB (varsayılanları var).

x-db-env: &db-env
  # Bağlantı dizesi burada, aynı değişkenlerden kurulur: ayrıca elle yazmak gerekmez ve parola repoda durmaz.
  # Not: parolada ';' kullanmayın (bağlantı dizesi ayracıdır).
  ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-hava_paneli};Username=${POSTGRES_USER:-hava_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}

x-collector: &collector
  build:
    context: .
    dockerfile: docker/collector.Dockerfile
  environment: *db-env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hava_paneli}
      POSTGRES_USER: ${POSTGRES_USER:-hava_user}
      # ':?' ile parola tanımlı değilse compose hata verir: boş/varsayılan parolayla çalışmasın.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      # Sadece bu bilgisayardan erişilir (127.0.0.1); ağdaki diğer cihazlar bağlanamaz. Çakışırsa DB_PORT ile değiştirin.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # İlk kurulum (tek seferlik, sonra çıkar): şemayı kurar, hesaplanmış iklim normallerini yükler, ilk veriyi çeker.
  # Normaller dosyadan geldiği için Open-Meteo'nun 30 yıllık veri limitine takılınmaz (K-025). Veri toplama (internet
  # gerekir) başarısız olsa bile uygulama açılır: hata mesajı yazılır, `docker compose run --rm collector` ile tekrarlanır.
  init:
    <<: *collector
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        dotnet HavaPaneli.Collector.dll --import-normals data/climate-normals.json &&
        (dotnet HavaPaneli.Collector.dll || echo 'UYARI: veri toplama tamamlanamadi; sonra tekrar deneyin: docker compose run --rm collector')
    restart: "no"

  # Elle çalıştırmak için: docker compose run --rm collector           (tahmin + depremler)
  #                        docker compose run --rm collector --normals (normalleri API'den yeniden hesapla)
  collector:
    <<: *collector
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *db-env
    # Şema hazır olmadan API açılmasın: init (şema + normaller) başarıyla bitmeli.
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Dışarıya port açılmaz: yalnızca arayüzün nginx'i (aynı ağda) erişir.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
