server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Güvenlik başlıkları: tarayıcının içerik türünü tahmin etmesini ve sayfanın başka sitede çerçevelenmesini engeller.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: tarayıcı yalnızca bu sunucuya konuşur; istek konteyner ağındaki "api" servisine iletilir.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Sağlık ucu: gerçek API'ye iletilir. Bu satır olmazsa /health "bilinmeyen yol" sayılıp index.html (200) döner
    # ve bir izleme aracı API çökmüş olsa bile "sağlıklı" görürdü.
    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Derlemede dosya adına içerik özeti (hash) eklenir: içerik değişirse ad değişir, bu yüzden güvenle uzun süre önbelleğe alınır.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sınır verisi nadiren değişir ama adı sabit: kısa süre önbellek.
    location /data/ {
        expires 1h;
    }

    # Tek sayfalık uygulama: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri /index.html;
    }
}
